<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>testingbranch</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #ffffff;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Add the GLTFLoader to load the 3D models -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 24; 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enablePan = false;
        controls.minDistance = 10;
        controls.maxDistance = 50;

        // ==========================================
        // 1. LIGHTING (Required for 3D Models & Earth)
        // ==========================================
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
        directionalLight.position.set(15, 20, 10);
        scene.add(directionalLight);

        const roygbiv = [0xFF0000, 0xFF7F00, 0xFFFF00, 0x00FF00, 0x0000FF, 0x4B0082, 0x9400D3];

        // Background particle stars
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 1500;
        const posArray = new Float32Array(starsCount * 3);
        const colorArray = new Float32Array(starsCount * 3);

        for(let i = 0; i < starsCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 100;
            colorArray[i] = Math.random(); 
        }

        starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        starsGeo.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));

        const starsMaterial = new THREE.PointsMaterial({
            size: 0.15,
            vertexColors: true,
            transparent: true,
            opacity: 0.6
        });

        const starMesh = new THREE.Points(starsGeo, starsMaterial);
        scene.add(starMesh);

        // ==========================================
        // 2. TEXTURED GLOBE & CAPE BRETON PIN
        // ==========================================
        const globeGroup = new THREE.Group();
        scene.add(globeGroup);

        const globeRadius = 6.0;

        // Use a highly saturated Blue Marble texture for the Earth
        const textureLoader = new THREE.TextureLoader();
        const earthTexture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');

        const earthGeometry = new THREE.SphereGeometry(globeRadius, 64, 64);
        const earthMaterial = new THREE.MeshStandardMaterial({ 
            map: earthTexture,
            roughness: 0.6,
            metalness: 0.1
        });
        const earth = new THREE.Mesh(earthGeometry, earthMaterial);
        // Standard Three.js spheres put the prime meridian in a weird spot, rotate it to align visually
        earth.rotation.y = -Math.PI / 2; 
        globeGroup.add(earth);

        // --- CAPE BRETON PIN ---
        const pinGroup = new THREE.Group();
        
        // Cape Breton Coordinates
        const lat = 46.13;
        const lon = -60.19;
        
        // Offset just in case you swap the texture image later and the map center shifts
        const textureLongitudeOffset = 0; 
        
        const phi = (90 - lat) * (Math.PI / 180);
        const theta = (lon + textureLongitudeOffset) * (Math.PI / 180);

        const px = -(globeRadius * Math.sin(phi) * Math.cos(theta));
        const pz = (globeRadius * Math.sin(phi) * Math.sin(theta));
        const py = globeRadius * Math.cos(phi);

        pinGroup.position.set(px, py, pz);
        // Makes the pin point straight out from the center of the earth
        pinGroup.lookAt(0, 0, 0); 

        // Create the 3D Pin (Red Cone + Sphere)
        const pinMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000, roughness: 0.2, metalness: 0.5 });
        
        const pinCone = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.6, 16), pinMaterial);
        pinCone.rotation.x = -Math.PI / 2; // Point tip down towards surface
        pinCone.position.z = 0.3; // Lift up so tip touches the ground
        pinGroup.add(pinCone);
        
        const pinHead = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), pinMaterial);
        pinHead.position.z = 0.6; // Sit on top of the cone
        pinGroup.add(pinHead);

        // Add the pin to the globeGroup so it rotates with the Earth
        globeGroup.add(pinGroup);

        // ==========================================
        // 3. 3D TEXT BAND
        // ==========================================
        const textBandGroup = new THREE.Group();
        textBandGroup.rotation.x = 0.15; 
        scene.add(textBandGroup);

        const textMeshes = [];
        const fontLoader = new THREE.FontLoader();
        fontLoader.load('https://threejs.org/examples/fonts/helvetiker_bold.typeface.json', function (font) {
            const textStr = "PLACEHOLDER TEXT  •  PLACEHOLDER TEXT  •  ";
            const textRadius = 7.5; 

            for (let i = 0; i < textStr.length; i++) {
                const char = textStr[i];
                
                const textGeo = new THREE.TextGeometry(char, {
                    font: font,
                    size: 0.7,
                    height: 0.15,
                    curveSegments: 3,
                    bevelEnabled: false
                });
                
                textGeo.computeBoundingBox();
                const centerOffset = -0.5 * (textGeo.boundingBox.max.x - textGeo.boundingBox.min.x);
                
                const charColor = roygbiv[Math.floor(Math.random() * roygbiv.length)];
                const textMesh = new THREE.Mesh(textGeo, new THREE.MeshStandardMaterial({
                    color: charColor,
                    roughness: 0.4
                }));

                const edges = new THREE.EdgesGeometry(textGeo);
                const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 }));
                textMesh.add(line);

                const angle = Math.PI - (i / textStr.length) * Math.PI * 2;
                textMesh.position.x = textRadius * Math.cos(angle);
                textMesh.position.z = textRadius * Math.sin(angle);

                textMesh.rotation.y = Math.PI / 2 - angle;
                textMesh.translateX(centerOffset); 

                textMesh.userData = { index: i, baseY: textMesh.position.y };
                textMeshes.push(textMesh);
                textBandGroup.add(textMesh);
            }
        });

        // ==========================================
        // 4. FLYING 3D MODELS (.glb)
        // ==========================================
        const gltfLoader = new THREE.GLTFLoader();
        const orbitingObjects = [];

        // Configuration array dictates how many to spawn, their orbit distance, and their speed
        const modelConfigs = [
            { file: 'satellite.glb', count: 3, distMin: 6.5, distMax: 7.5, speed: 0.006, scale: 0.5 },
            { file: 'sputnik.glb',   count: 2, distMin: 6.5, distMax: 7.5, speed: 0.007, scale: 0.5 },
            { file: 'ship.glb',      count: 2, distMin: 7.0, distMax: 8.5, speed: 0.008, scale: 0.6 },
            { file: 'moon.glb',      count: 2, distMin: 9.0, distMax: 11.0, speed: 0.002, scale: 1.0 },
            { file: 'asteroid.glb',  count: 3, distMin: 8.5, distMax: 11.5, speed: 0.003, scale: 0.8 },
            { file: 'alien.glb',     count: 2, distMin: 9.0, distMax: 11.0, speed: 0.004, scale: 0.6 },
            { file: 'star.glb',      count: 3, distMin: 14.0, distMax: 18.0, speed: 0.001, scale: 1.2 }
        ];

        modelConfigs.forEach(config => {
            for (let i = 0; i < config.count; i++) {
                gltfLoader.load(`./models/${config.file}`, function(gltf) {
                    const model = gltf.scene;
                    const pivot = new THREE.Group();
                    
                    model.scale.set(config.scale, config.scale, config.scale);
                    
                    // Assign distance based on config
                    const distance = config.distMin + Math.random() * (config.distMax - config.distMin);
                    model.position.set(distance, 0, 0);

                    pivot.add(model);

                    // Randomize starting position around the globe
                    pivot.rotation.x = Math.random() * Math.PI * 2;
                    pivot.rotation.y = Math.random() * Math.PI * 2;
                    pivot.rotation.z = Math.random() * Math.PI * 2;

                    // Set orbit speed and direction
                    pivot.userData = {
                        speed: (Math.random() < 0.5 ? -1 : 1) * (config.speed + Math.random() * 0.001),
                        modelRef: model // save reference to spin the model itself
                    };

                    scene.add(pivot);
                    orbitingObjects.push(pivot);
                });
            }
        });

        const clock = new THREE.Clock();

        // ==========================================
        // 5. ANIMATION LOOP
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();

            controls.update();

            // Rotate Earth
            globeGroup.rotation.y += 0.0015;
            globeGroup.position.y = Math.sin(time * 1.5) * 0.2;

            // Rotate background stars
            starMesh.rotation.y += 0.0005;
            starMesh.rotation.x += 0.0002;

            // Rotate text band
            textBandGroup.rotation.y -= 0.002;
            
            textMeshes.forEach(mesh => {
                mesh.position.y = mesh.userData.baseY + Math.sin(time * 3 + mesh.userData.index * 0.5) * 0.4;
            });

            // Move orbiting 3D models
            orbitingObjects.forEach(pivot => {
                pivot.rotateY(pivot.userData.speed);
                
                // Add a slow tumbling effect to the model itself so they don't look stiff
                if (pivot.userData.modelRef) {
                    pivot.userData.modelRef.rotation.x += 0.005;
                    pivot.userData.modelRef.rotation.y += 0.005;
                }
            });

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
