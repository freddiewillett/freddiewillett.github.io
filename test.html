<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Website - 3D Landing Page</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #ffffff; /* Plain white page */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Include Three.js from a reliable CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // ==========================================
        // 1. SCENE SETUP
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        // Set up the camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 12; // Lock the globe securely in the middle of the screen

        // Set up the renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // ==========================================
        // 2. 3D WIREFRAME GLOBE
        // ==========================================
        // Uses 24 horizontal and 16 vertical segments to match the reference image style
        const globeGeometry = new THREE.SphereGeometry(5, 24, 16);
        const globeMaterial = new THREE.MeshBasicMaterial({
            color: 0x000000,   // Black lines
            wireframe: true,
            transparent: true,
            opacity: 0.8
        });
        const globe = new THREE.Mesh(globeGeometry, globeMaterial);
        scene.add(globe);

        // ==========================================
        // 3. SPINNING TEXT BAND
        // ==========================================
        // Draws text dynamically on a hidden canvas to wrap it around the globe
        function createTextTexture() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            // --- CHANGE YOUR TEXT HERE ---
            const text = "PLACEHOLDER TEXT  •  ";

            ctx.font = 'bold 50px sans-serif';
            // Measure text width to map the canvas seamlessly without stretching
            const textWidth = ctx.measureText(text).width;

            canvas.width = textWidth;
            canvas.height = 128; // Fixed vertical height

            // Re-apply font and styles after resizing the canvas
            ctx.font = 'bold 50px sans-serif';
            ctx.fillStyle = '#000000'; // Black text color
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Draw the text directly into the center of our canvas
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.repeat.set(4, 1); // Loops the text 4 times around the globe
            return texture;
        }

        // Apply the canvas texture to an open-ended cylinder slightly larger than the globe
        const textBandGeometry = new THREE.CylinderGeometry(5.2, 5.2, 1.5, 64, 1, true);
        const textBandMaterial = new THREE.MeshBasicMaterial({
            map: createTextTexture(),
            transparent: true,
            side: THREE.DoubleSide,
            alphaTest: 0.1 // Ensures clean rendering over the inner wireframe
        });

        const textBand = new THREE.Mesh(textBandGeometry, textBandMaterial);
        textBand.rotation.x = 0.15; // Give the band a slight tilt for depth
        scene.add(textBand);

        // ==========================================
        // 4. FLYING ICONS
        // ==========================================
        const icons = [];
        const numberOfIcons = 8;

        // --- CHANGE YOUR ICON MESH HERE ---
        // Currently using simple dark 3D boxes as placeholders.
        // You can easily swap this out for a THREE.SpriteMaterial (to use 2D PNG icons)
        // or load actual 3D files using the THREE.GLTFLoader later on.
        const iconGeometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
        const iconMaterial = new THREE.MeshBasicMaterial({ color: 0x333333 });

        for (let i = 0; i < numberOfIcons; i++) {
            // A pivot acts as an invisible anchor at the center of the globe
            const pivot = new THREE.Group();
            const icon = new THREE.Mesh(iconGeometry, iconMaterial);

            // Set distance from the globe (orbit radius)
            const distance = 6.5 + Math.random() * 2;
            icon.position.set(distance, 0, 0);

            pivot.add(icon);

            // Randomize starting position around the sphere
            pivot.rotation.x = Math.random() * Math.PI * 2;
            pivot.rotation.y = Math.random() * Math.PI * 2;
            pivot.rotation.z = Math.random() * Math.PI * 2;

            // Store random speeds for the animation loop
            pivot.userData = {
                speedX: (Math.random() - 0.5) * 0.02,
                speedY: (Math.random() - 0.5) * 0.02,
                speedZ: (Math.random() - 0.5) * 0.02
            };

            scene.add(pivot);
            icons.push(pivot);
        }

        // ==========================================
        // 5. ANIMATION LOOP
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);

            // Rotate the center wireframe slowly
            globe.rotation.y += 0.002;
            globe.rotation.x += 0.0005;

            // Spin the text band
            textBand.rotation.y -= 0.004;

            // Move the flying icons along their randomized orbits
            icons.forEach(pivot => {
                pivot.rotation.x += pivot.userData.speedX;
                pivot.rotation.y += pivot.userData.speedY;
                pivot.rotation.z += pivot.userData.speedZ;

                // Make the placeholder boxes tumble as they fly
                const iconBox = pivot.children[0];
                iconBox.rotation.x += 0.02;
                iconBox.rotation.y += 0.02;
            });

            renderer.render(scene, camera);
        }

        animate();

        // ==========================================
        // 6. WINDOW RESIZE HANDLING
        // ==========================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
