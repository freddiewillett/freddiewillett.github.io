<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>testscene</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #ffffff;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 24; 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enablePan = false;
        controls.minDistance = 10;
        controls.maxDistance = 50;

        const roygbiv = [0xFF0000, 0xFF7F00, 0xFFFF00, 0x00FF00, 0x0000FF, 0x4B0082, 0x9400D3];

        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 1500;
        const posArray = new Float32Array(starsCount * 3);
        const colorArray = new Float32Array(starsCount * 3);

        for(let i = 0; i < starsCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 100;
            colorArray[i] = Math.random(); 
        }

        starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        starsGeo.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));

        const starsMaterial = new THREE.PointsMaterial({
            size: 0.15,
            vertexColors: true,
            transparent: true,
            opacity: 0.6
        });

        const starMesh = new THREE.Points(starsGeo, starsMaterial);
        scene.add(starMesh);

        const globeGroup = new THREE.Group();
        scene.add(globeGroup);

        const globeRadius = 6.0;

        const occluderGeometry = new THREE.SphereGeometry(globeRadius, 32, 32);
        const occluderMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const occluder = new THREE.Mesh(occluderGeometry, occluderMaterial);
        globeGroup.add(occluder);

        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x000000 });
        const lineRadius = globeRadius + 0.02; 

        for (let i = 1; i < 16; i++) {
            const latAngle = (Math.PI / 16) * i;
            const y = lineRadius * Math.cos(latAngle);
            const r = lineRadius * Math.sin(latAngle);

            const points = [];
            for (let j = 0; j <= 64; j++) {
                const lon = (j / 64) * Math.PI * 2;
                points.push(new THREE.Vector3(r * Math.cos(lon), y, r * Math.sin(lon)));
            }
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            globeGroup.add(new THREE.Line(geometry, lineMaterial));
        }

        for (let i = 0; i < 12; i++) {
            const lonAngle = (Math.PI / 12) * i;
            const points = [];
            for (let j = 0; j <= 64; j++) {
                const lat = (j / 64) * Math.PI * 2;
                points.push(new THREE.Vector3(
                    lineRadius * Math.sin(lat) * Math.cos(lonAngle),
                    lineRadius * Math.cos(lat),
                    lineRadius * Math.sin(lat) * Math.sin(lonAngle)
                ));
            }
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            globeGroup.add(new THREE.Line(geometry, lineMaterial));
        }

        const textBandGroup = new THREE.Group();
        textBandGroup.rotation.x = 0.15; 
        scene.add(textBandGroup);

        const textMeshes = [];
        const fontLoader = new THREE.FontLoader();
        fontLoader.load('https://threejs.org/examples/fonts/helvetiker_bold.typeface.json', function (font) {
            const textStr = "FREDDIE WILLETT  •  FREDDIE WILLETT  •  ";
            const textRadius = 7.5; 

            for (let i = 0; i < textStr.length; i++) {
                const char = textStr[i];
                
                const textGeo = new THREE.TextGeometry(char, {
                    font: font,
                    size: 0.7,
                    height: 0.15,
                    curveSegments: 3,
                    bevelEnabled: false
                });
                
                textGeo.computeBoundingBox();
                const centerOffset = -0.5 * (textGeo.boundingBox.max.x - textGeo.boundingBox.min.x);
                
                const charColor = roygbiv[Math.floor(Math.random() * roygbiv.length)];
                const textMesh = new THREE.Mesh(textGeo, new THREE.MeshBasicMaterial({color: charColor}));

                const edges = new THREE.EdgesGeometry(textGeo);
                const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 }));
                textMesh.add(line);

                const angle = Math.PI - (i / textStr.length) * Math.PI * 2;
                textMesh.position.x = textRadius * Math.cos(angle);
                textMesh.position.z = textRadius * Math.sin(angle);

                textMesh.rotation.y = Math.PI / 2 - angle;
                textMesh.translateX(centerOffset); 

                textMesh.userData = { index: i, baseY: textMesh.position.y };
                textMeshes.push(textMesh);
                textBandGroup.add(textMesh);
            }
        });

        const totalIconsInFolder = 54;
        const numberOfIconsToDisplay = 8;
        const selectedIndices = new Set();
        
        while(selectedIndices.size < numberOfIconsToDisplay) {
            selectedIndices.add(Math.floor(Math.random() * totalIconsInFolder) + 1);
        }

        const iconUrls = Array.from(selectedIndices).map(num => `./ico/${num}.png`);

        const icons = [];
        const textureLoader = new THREE.TextureLoader();

        iconUrls.forEach((url) => {
            const pivot = new THREE.Group();
            
            textureLoader.load(url, function(texture) {
                const spriteMaterial = new THREE.SpriteMaterial({ 
                    map: texture,
                    depthTest: true 
                });

                const sprite = new THREE.Sprite(spriteMaterial);
                
                const distance = 6.4 + Math.random() * 1.0;
                sprite.position.set(distance, 0, 0);

                pivot.add(sprite);

                pivot.rotation.x = Math.random() * Math.PI * 2;
                pivot.rotation.y = Math.random() * Math.PI * 2;
                pivot.rotation.z = Math.random() * Math.PI * 2;

                pivot.userData = {
                    speed: (Math.random() < 0.5 ? -1 : 1) * (0.001 + Math.random() * 0.002),
                    spriteRef: sprite
                };

                scene.add(pivot);
                icons.push(pivot);
            });
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();

            controls.update();

            globeGroup.rotation.y += 0.002;
            globeGroup.position.y = Math.sin(time * 1.5) * 0.2;

            starMesh.rotation.y += 0.0005;
            starMesh.rotation.x += 0.0002;

            textBandGroup.rotation.y -= 0.002;
            
            textMeshes.forEach(mesh => {
                mesh.position.y = mesh.userData.baseY + Math.sin(time * 3 + mesh.userData.index * 0.5) * 0.4;
            });

            icons.forEach(pivot => {
                pivot.rotateZ(pivot.userData.speed);
                
                if (pivot.userData.spriteRef) {
                    const scaleWave = 1.0 + Math.sin(time * 3 + pivot.rotation.x) * 0.15;
                    pivot.userData.spriteRef.scale.set(scaleWave, scaleWave, scaleWave);
                }
            });

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
