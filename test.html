<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>testscene</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #ffffff;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 24; 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const roygbiv = [0xFF0000, 0xFF7F00, 0xFFFF00, 0x00FF00, 0x0000FF, 0x4B0082, 0x9400D3];

        const globeGroup = new THREE.Group();
        scene.add(globeGroup);

        const globeRadius = 6.0;

        const occluderGeometry = new THREE.SphereGeometry(globeRadius, 32, 32);
        const occluderMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const occluder = new THREE.Mesh(occluderGeometry, occluderMaterial);
        globeGroup.add(occluder);

        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x000000 });
        const lineRadius = globeRadius + 0.02; 

        for (let i = 1; i < 16; i++) {
            const latAngle = (Math.PI / 16) * i;
            const y = lineRadius * Math.cos(latAngle);
            const r = lineRadius * Math.sin(latAngle);

            const points = [];
            for (let j = 0; j <= 64; j++) {
                const lon = (j / 64) * Math.PI * 2;
                points.push(new THREE.Vector3(r * Math.cos(lon), y, r * Math.sin(lon)));
            }
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            globeGroup.add(new THREE.Line(geometry, lineMaterial));
        }

        for (let i = 0; i < 12; i++) {
            const lonAngle = (Math.PI / 12) * i;
            const points = [];
            for (let j = 0; j <= 64; j++) {
                const lat = (j / 64) * Math.PI * 2;
                points.push(new THREE.Vector3(
                    lineRadius * Math.sin(lat) * Math.cos(lonAngle),
                    lineRadius * Math.cos(lat),
                    lineRadius * Math.sin(lat) * Math.sin(lonAngle)
                ));
            }
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            globeGroup.add(new THREE.Line(geometry, lineMaterial));
        }

        const textBandGroup = new THREE.Group();
        textBandGroup.rotation.x = 0.15; 
        scene.add(textBandGroup);

        const fontLoader = new THREE.FontLoader();
        fontLoader.load('https://threejs.org/examples/fonts/helvetiker_bold.typeface.json', function (font) {
            const textStr = "freddie willett freddie willett ";
            const textRadius = 7.5; 

            for (let i = 0; i < textStr.length; i++) {
                const char = textStr[i];
                
                const textGeo = new THREE.TextGeometry(char, {
                    font: font,
                    size: 0.7,
                    height: 0.15,
                    curveSegments: 3,
                    bevelEnabled: false
                });
                
                textGeo.computeBoundingBox();
                const centerOffset = -0.5 * (textGeo.boundingBox.max.x - textGeo.boundingBox.min.x);
                
                const charColor = roygbiv[Math.floor(Math.random() * roygbiv.length)];
                const textMesh = new THREE.Mesh(textGeo, new THREE.MeshBasicMaterial({color: charColor}));

                const angle = Math.PI - (i / textStr.length) * Math.PI * 2;
                textMesh.position.x = textRadius * Math.cos(angle);
                textMesh.position.z = textRadius * Math.sin(angle);

                textMesh.rotation.y = Math.PI / 2 - angle;
                textMesh.translateX(centerOffset); 

                textBandGroup.add(textMesh);
            }
        });

        const icons = [];
        const numberOfIcons = 8;

        function createPlaceholderTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(32, 32, 28, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#000000';
            ctx.stroke();
            return new THREE.CanvasTexture(canvas);
        }

        const sharedTexture = createPlaceholderTexture();

        for (let i = 0; i < numberOfIcons; i++) {
            const pivot = new THREE.Group();
            
            const spriteColor = roygbiv[Math.floor(Math.random() * roygbiv.length)];
            const spriteMaterial = new THREE.SpriteMaterial({ 
                map: sharedTexture,
                color: spriteColor,
                depthTest: true 
            });

            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(1.2, 1.2, 1.2); 
            
            const distance = 8.5 + Math.random() * 3;
            sprite.position.set(distance, 0, 0);

            pivot.add(sprite);

            pivot.rotation.x = Math.random() * Math.PI * 2;
            pivot.rotation.y = Math.random() * Math.PI * 2;
            pivot.rotation.z = Math.random() * Math.PI * 2;

            pivot.userData = {
                speedX: (Math.random() - 0.5) * 0.02,
                speedY: (Math.random() - 0.5) * 0.02,
                speedZ: (Math.random() - 0.5) * 0.02
            };

            scene.add(pivot);
            icons.push(pivot);
        }

        function animate() {
            requestAnimationFrame(animate);

            globeGroup.rotation.y += 0.0005;

            textBandGroup.rotation.y -= 0.002;
            textBandGroup.position.y = Math.sin(Date.now() * 0.003) * 0.5;

            icons.forEach(pivot => {
                pivot.rotation.x += pivot.userData.speedX;
                pivot.rotation.y += pivot.userData.speedY;
                pivot.rotation.z += pivot.userData.speedZ;
            });

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
